# OVH 控制台 —— Docker 部署
#
# 起：  docker compose up -d
# 更新：docker compose pull && docker compose up -d
# 日志：docker compose logs -f
#
# ⚠️ 数据全在 ./data 这一个目录里：SQLite 数据库、**数据库加密密钥**、缓存、日志。
#    备份就备份这个目录。删了它 = 已保存的 OVH 凭据和 Telegram Token 再也解不开。

services:
  ovh-console:
    image: ghcr.io/gokele/ovh:latest
    container_name: ovh-console
    restart: unless-stopped

    ports:
      # 左边是宿主机端口，想换就改左边。
      # 默认只绑回环：这个服务能下单、能重装服务器，不该直接对公网开。
      # 要从别的机器访问就放在反向代理后面，并且务必设好 API_SECRET_KEY。
      - "127.0.0.1:20000:20000"

    volumes:
      # 唯一需要持久化的目录。用 bind mount 方便直接备份；
      # 首次启动时容器会把它的归属改成 PUID:PGID。
      - ./data:/data

    environment:
      # ── 必填 ──────────────────────────────────────────────
      # 访问密码。默认值是 123456，不改等于门没锁 ——
      # 而这个服务能用你的 OVH 账户下单和重装服务器。
      API_SECRET_KEY: "改成一串你自己的随机字符串"

      # ── 建议填 ────────────────────────────────────────────
      # 数据库加密密钥。不填会自动生成并写进 ./data/.env（跟着卷走，不会丢）。
      # 显式提供的好处是：换机器、迁移、k8s secret 都更可控。
      # 丢了这把钥匙，已加密的凭据就再也解不开了。
      # OVH_DB_KEY: "64 位 hex，或任意长口令"

      # ── 可选 ──────────────────────────────────────────────
      TZ: "Asia/Shanghai"
      # 容器内文件的属主。想和宿主机当前用户对齐就填 id -u / id -g 的结果
      # PUID: "1000"
      # PGID: "1000"
      # 允许的跨域来源（放在反代后面时可能要设）
      # CORS_ALLOWED_ORIGINS: "https://ovh.example.com"
      # 信任的反代（设了才会用 X-Forwarded-For 判断来源 IP）
      # TRUSTED_PROXIES: "172.16.0.0/12"

    # 自更新在容器里是停用的（镜像里设了 OVH_IN_CONTAINER=1）。
    # 原因：新二进制只会写进容器的可写层，容器一重建就回到镜像里的旧版本。
    # 更新请用 docker compose pull && docker compose up -d。
